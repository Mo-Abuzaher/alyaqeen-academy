    <style>
      :root {
        --color-primary: #064E3B;
        --color-primary-dark: #022c22;
        --color-accent: #D4AF37;
        --color-bg: #F9FBF9;
        --color-bg-alt: #F0F4F1;
        --color-text: #27272A;
        --color-text-muted: #52525B;
        --color-border: #E4EBE5;
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
      }

      body {
        font-family: 'Lexend', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--color-bg);
        color: var(--color-text);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Soft ambient glows */
      .ambient {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background:
          radial-gradient(60% 45% at 85% -5%, rgba(212, 175, 55, 0.09) 0%, rgba(212, 175, 55, 0) 70%),
          radial-gradient(55% 50% at 8% 105%, rgba(6, 78, 59, 0.07) 0%, rgba(6, 78, 59, 0) 70%);
      }

      .page {
        position: relative;
        z-index: 1;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 4rem 1.5rem;
      }

      /* Entrance animations (pure CSS, staggered) */
      @keyframes riseIn {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .fade-item {
        animation: riseIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .fade-1 { animation-delay: 0.05s; }
      .fade-2 { animation-delay: 0.15s; }
      .fade-3 { animation-delay: 0.25s; }
      .fade-4 { animation-delay: 0.35s; }
      .fade-5 { animation-delay: 0.45s; }
      .fade-6 { animation-delay: 0.55s; }

      .logo {
        width: 72px;
        height: auto;
        border-radius: 16px;
        margin-bottom: 2rem;
        box-shadow: 0 8px 30px rgba(6, 78, 59, 0.12);
      }

      .error-code {
        font-size: clamp(6rem, 20vw, 10rem);
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.04em;
        background: linear-gradient(135deg, var(--color-primary) 30%, var(--color-primary-dark) 70%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        user-select: none;
      }

      /* Gold accent slash inside the code */
      .error-code .accent {
        background: linear-gradient(135deg, var(--color-accent) 0%, #b8933f 100%);
        -webkit-background-clip: text;
        background-clip: text;
      }

      .divider {
        width: 56px;
        height: 3px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--color-accent), rgba(212, 175, 55, 0.25));
        margin: 1.75rem auto;
      }

      h1 {
        font-size: clamp(1.35rem, 4vw, 1.75rem);
        font-weight: 700;
        color: var(--color-primary);
        letter-spacing: -0.01em;
      }

      .message {
        max-width: 26rem;
        margin-top: 0.9rem;
        font-size: 0.95rem;
        line-height: 1.7;
        color: var(--color-text-muted);
        font-weight: 300;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.9rem;
        margin-top: 2.25rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        height: 3rem;
        padding: 0 1.9rem;
        border-radius: 999px;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 700;
        text-decoration: none;
        letter-spacing: 0.01em;
        transition: transform 0.2s ease, box-shadow 0.25s ease, background-color 0.2s ease, border-color 0.2s ease;
      }

      .btn:active {
        transform: scale(0.96);
      }

      .btn-primary {
        background: var(--color-primary);
        color: #ffffff;
        box-shadow: 0 4px 20px rgba(6, 78, 59, 0.18);
      }

      .btn-primary:hover {
        background: var(--color-primary-dark);
        transform: translateY(-2px);
        box-shadow: 0 10px 28px rgba(6, 78, 59, 0.24);
      }

      .btn-secondary {
        background: transparent;
        color: var(--color-primary);
        border: 1.5px solid var(--color-border);
      }

      .btn-secondary:hover {
        border-color: rgba(6, 78, 59, 0.45);
        background: rgba(6, 78, 59, 0.04);
        transform: translateY(-2px);
      }

      footer {
        position: relative;
        z-index: 1;
        padding: 1.5rem;
        text-align: center;
        font-size: 0.75rem;
        color: var(--color-text-muted);
        opacity: 0.75;
        font-weight: 300;
      }
    </style>
  </head>
